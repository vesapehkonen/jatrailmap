name: Deploy JaTrail backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "FastAPI image tag: latest or full 40-character commit SHA"
        required: true
        default: latest
        type: string

concurrency:
  group: jatrail-vps-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Replace FastAPI container
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s\n' "$IMAGE_TAG" | grep -Eq '^(latest|[0-9a-f]{40})$'; then
            echo "image_tag must be latest or a full lowercase commit SHA" >&2
            exit 2
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          install -m 0700 -d "$RUNNER_TEMP/ssh"
          printf '%s' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy only the FastAPI container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh -i "$RUNNER_TEMP/ssh/key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "/srv/jatrail/deploy/scripts/deploy_backend.sh '$IMAGE_TAG'"
