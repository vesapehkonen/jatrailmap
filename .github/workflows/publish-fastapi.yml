name: Publish FastAPI container

on:
  push:
    branches:
      - main
    paths:
      - "fastapi/**"
      - ".github/workflows/publish-fastapi.yml"
      - "!fastapi/**/*.md"
  workflow_dispatch:

concurrency:
  group: publish-fastapi-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test-and-publish:
    name: Test and publish FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/pyproject.toml

      - name: Install FastAPI test dependencies
        working-directory: fastapi
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run FastAPI tests
        working-directory: fastapi
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable commit tag
        env:
          COMMIT_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$COMMIT_IMAGE" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable image: $COMMIT_IMAGE" >&2
            exit 1
          fi

      - name: Build and publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi
          file: ./fastapi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
