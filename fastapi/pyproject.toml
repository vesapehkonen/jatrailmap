[project]
name = "jatrail-fastapi"
version = "0.1.0"
description = "JaTrail GPS trail sharing application"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.1,<5",
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.10,<5",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "anyio>=4.4,<4.10",
  "httpx>=0.27,<1",
  "mongomock>=4.3,<5",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
