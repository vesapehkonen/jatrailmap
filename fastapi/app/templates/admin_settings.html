{% extends "base.html" %}{% block title %}Registration settings · JaTrail{% endblock %}{% block content %}{% include "_admin_nav.html" %}<section class="page-heading"><div><span class="eyebrow">Administration</span><h1>Registration controls</h1><p>Control new account access and the quotas assigned at registration.</p></div></section><section class="settings-card"><form id="registration-settings-form" class="form-grid"><label class="check-row"><input type="checkbox" name="enabled" {% if registration.enabled %}checked{% endif %}> Allow new account registration</label><label class="check-row"><input type="checkbox" name="approval_required" {% if registration.approval_required %}checked{% endif %}> Require administrator approval</label><label>Account storage (MB)<input type="number" name="account_storage_mb" min="1" value="{{ registration.account_storage_mb }}" required></label><label>Photo size (MB)<input type="number" name="image_mb" min="1" value="{{ registration.image_mb }}" required></label><label>Photos per trail<input type="number" name="photos_per_trail" min="1" value="{{ registration.photos_per_trail }}" required></label><label>Trail upload (MB)<input type="number" name="upload_mb" min="1" value="{{ registration.upload_mb }}" required></label><button type="submit">Save registration settings</button></form><p id="admin-status" role="status"></p></section>{% endblock %}{% block scripts %}<script src="/static/admin.js" defer></script>{% endblock %}
